<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Minha Agenda</h1>
    <div class="form-container">
        <input id="tarefas" type="text" placeholder="Insira aqui sua tarefa">
        <input id="selecionar-data" type="date">
        <button onclick="adicionarTarefa()">Adicionar tarefa</button>
    </div>

    <div id="lista-de-tarefas"></div>

    <script>
        /// seção de modelagem
        let afazeres;
        const afazeresSalvos = JSON.parse(localStorage.getItem("afazeres"));

        if (Array.isArray(afazeresSalvos)) {
            afazeres = afazeresSalvos;
        } else {
            afazeres = [
                { nome: "Lavar louça", data: "20-08-2025", id: "id1", concluida: false },
                { nome: "Secar louça", data: "25-08-2025", id: "id2", concluida: false },
                { nome: "Estender roupa", data: "22-08-2025", id: "id3", concluida: false },
                { nome: "Assistir jogo do Bahia", data: "16-08-2025", id: "id4", concluida: false }
            ];
        }

        let salvarTarefas = () => localStorage.setItem("afazeres", JSON.stringify(afazeres));

        let adicionarTarefa = () => {
            const campoTarefa = document.getElementById("tarefas");
            const tarefa = campoTarefa.value;

            const campoData = document.getElementById("selecionar-data");
            const prazo = campoData.value;

            // transforma "yyyy-mm-dd" em "dd-mm-yyyy"
            let [ano, mes, dia] = prazo.split("-");
            let dataFormatada = `${dia}-${mes}-${ano}`;

            const cron = "" + new Date().getTime();

            afazeres.push({
                nome: tarefa,
                data: dataFormatada,
                id: cron,
                concluida: false
            });

            salvarTarefas();
            renderizar();
        };

        let concluirTarefa = (id) => {
            afazeres = afazeres.map(t => t.id === id ? {...t, concluida: !t.concluida} : t);
            salvarTarefas();
            renderizar();
        };

        let renderizar = () => {
            const lista = document.getElementById("lista-de-tarefas");
            lista.innerHTML = "";

            afazeres.forEach(tarefa => {
                let div = document.createElement("div");
                div.className = "tarefa" + (tarefa.concluida ? " concluida" : "");

                div.innerHTML = `
                    <span>${tarefa.nome} - ${tarefa.data}</span>
                    <button onclick="concluirTarefa('${tarefa.id}')">
                        ${tarefa.concluida ? "Desmarcar" : "Concluir"}
                    </button>
                `;

                lista.appendChild(div);
            });
        };

        renderizar();
    </script>
</body>
</html>
